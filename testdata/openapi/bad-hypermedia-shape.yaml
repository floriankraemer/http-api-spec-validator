openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
security:
  - bearerAuth: []
paths:
  /v1/orders/{orderId}:
    parameters:
      - name: orderId
        in: path
        required: true
        schema:
          type: string
    get:
      tags:
        - idempotent
      responses:
        '200':
          description: The order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderResponse'
        '404':
          description: The order does not exist.
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    Problem:
      type: object
      required:
        - type
        - title
        - status
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
    Action:
      type: object
      required:
        - href
        - method
      properties:
        href:
          type: string
        method:
          type: string
          enum:
            - GET
            - POST
            - PUT
            - PATCH
            - DELETE
        title:
          type: string
      additionalProperties: false
    OrderResponse:
      type: object
      required:
        - data
      properties:
        data:
          type: object
          properties:
            order:
              type: object
              properties:
                id:
                  type: string
        _actions:
          type: object
          minProperties: 1
          additionalProperties:
            $ref: '#/components/schemas/Action'
